name: CI

# [2026-09-22] Antes: `branches-ignore: [main]` → como todo se trabaja directo en main,
# ningún push se validaba. Ahora corre en cada push a main y en PRs.
# El build de producción lo hace Vercel en cada push; aquí se valida calidad y tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — tipos, lint, tests y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Auditoría de dependencias (falla solo con vulnerabilidades críticas)
        run: npm audit --audit-level=critical --omit=dev
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests unitarios
        run: npx vitest run
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  functions:
    name: Cloud Functions — tipos, lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx eslint src --ext .ts
      - run: npm test
