name: Lighthouse (producción)

# [2026-09-22] Antes compilaba el proyecto completo en cada push (sin variables de entorno) y
# medía un servidor local con emulador: ni representativo ni estable. Ahora mide la web real
# publicada, una vez por semana o a demanda, y deja el informe enlazado en el resumen.
on:
  schedule:
    - cron: '0 11 * * 1' # lunes 6:00 a. m. hora Colombia
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Medir desmulta.online
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.production.js
