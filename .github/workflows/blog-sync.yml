name: Sincronización Automática de Blog

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (01:00 AM hora de Colombia)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permite ejecutar de forma manual desde la interfaz de GitHub Actions

permissions:
  contents: write

jobs:
  sync-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Sincronización de Feed
        run: npm run blog:sync
        env:
          BLOG_RSS_URL: ${{ secrets.BLOG_RSS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: "https://desmulta.online"

      - name: Crear Pull Request con nuevos borradores
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "automatización: importar nuevos borradores de blog"
          branch: blog-sync/update-feed
          title: "🤖 Nuevos borradores de blog — requiere revisión"
          body: |
            Se han importado nuevos borradores de blog automáticamente desde el feed RSS.
            Por favor, revisa el contenido de las noticias antes de aprobar este Pull Request para evitar problemas tipográficos o expresiones MDX inválidas.
          labels: |
            blog
            automatización
