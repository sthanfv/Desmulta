name: Lighthouse CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        # Desactivamos comprobaciones de tipos y linter para que Lighthouse evalúe solo el rendimiento del build final.
        # Las validaciones de tipos se hacen en el workflow de CI principal.
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: true
          USE_FIREBASE_EMULATOR: true
          
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
