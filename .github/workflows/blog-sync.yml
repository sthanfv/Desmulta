name: Sincronización Automática de Blog

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (01:00 AM hora de Colombia)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permite ejecutar de forma manual desde la interfaz de GitHub Actions

permissions:
  contents: write

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      # [2026-09-24] Antes no se pasaba GEMINI_API_KEY: los artículos nunca se reescribían con IA
      - name: Ejecutar Sincronización de Feed
        run: npm run blog:sync
        env:
          BLOG_RSS_URL: ${{ secrets.BLOG_RSS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: 'https://desmulta.online'

      # [2026-09-24] Publicación directa en main (el proyecto no usa ramas ni PRs). Antes se abría
      # un Pull Request a blog-sync/update-feed que nadie aprobaba y las noticias no llegaban a la web.
      - name: Publicar nuevos artículos en main
        run: |
          if [ -z "$(git status --porcelain src/content/blog)" ]; then
            echo "Sin artículos nuevos."
            exit 0
          fi
          git config user.name "desmulta-bot"
          git config user.email "desmulta-bot@users.noreply.github.com"
          git add src/content/blog
          git commit -m "automatización: importar nuevos artículos del blog"
          git push origin HEAD:main
