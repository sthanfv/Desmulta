name: CD — Firebase

# [2026-09-22] Vercel ya despliega la web automáticamente con cada push (integración Git).
# Antes este workflow volvía a compilar y desplegar a Vercel con --prod (dos despliegues de
# producción compitiendo). Ahora solo despliega lo que Vercel no cubre: reglas, índices y
# Cloud Functions de Firebase, y únicamente cuando esos archivos cambian.
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'functions/**'
  workflow_dispatch:

concurrency:
  group: cd-firebase
  cancel-in-progress: false

jobs:
  firebase:
    name: Desplegar reglas, índices y Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Verificar credenciales
        if: env.FIREBASE_TOKEN == ''
        run: |
          echo "::error::Falta el secreto FIREBASE_TOKEN en Settings > Secrets and variables > Actions."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Dependencias de Functions (el predeploy compila con tsc)
        run: npm ci --prefix functions
      - name: Deploy a Firebase
        run: npx --yes firebase-tools@15 deploy --only firestore:rules,firestore:indexes,functions --non-interactive --token "$FIREBASE_TOKEN"
